[project]
name = "fashion-ai-platform"
version = "0.1.0"
description = "Multimodal fashion retrieval pipeline"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14",
  "faiss-cpu>=1.9",
  "fastapi>=0.115",
  "httpx>=0.28",
  "numpy>=1.26",
  "open-clip-torch>=2.26",
  "pandas>=2.2",
  "pillow>=10.4",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.20",
  "python-dotenv>=1.0",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "torch>=2.5",
  "tqdm>=4.67",
  "uvicorn[standard]>=0.34",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "backend*"]
exclude = ["tests*", "data*"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
